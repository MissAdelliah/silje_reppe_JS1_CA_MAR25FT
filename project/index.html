<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/products.js" defer></script>
  </head>
  <body>
    <header>
      <div class="wrap row row-between">
        <div class="logo">
          <a href="index.html">GAMEHUB</a>
        </div>
        <div class="header-action row">
          <div class="search">
            <label for="search" class="visually-hidden">Search games</label>
            <input id="search" type="search" placeholder="Search for game" />
          </div>
          <nav class="nav_categories" aria-label="Main navigation">
            <a href="checkout/" class="links cart.link">
              CART
              <span id="items-count-cart">0</span>
            </a>
          </nav>
        </div>
      </div>
    </header>
    <main class="wrap">
      <section class="header">
        <div class="row row-between">
          <h1 class="header-title">Online store</h1>
        </div>
        <nav id="genre-nav" aria-label="Genres"></nav>
        <nav id="age-nav" aria-label="Age rating filters"></nav>
      </section>
      <section id="product-list" class="container-home"></section>
    </main>
    <footer class="footer">
      <div class="website__rights">
        <p>Terms & conditions</p>
        <p class="website__rights--text">&copy; 2025 GAMEHUB</p>
      </div>
    </footer>
  </body>
</html>
