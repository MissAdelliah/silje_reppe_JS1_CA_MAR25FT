<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart / Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/cart.js" defer></script>
  </head>
  <body>
    <header>
      <div class="wrap row row-between">
        <div class="logo">
          <a href="index.html">GAMEHUB</a>
        </div>
        <nav class="nav_categories" aria-label="Main navigation">
          <a href="../checkout/" class="links cart-link">
            CART
            <span id="items-count-cart">0</span>
            <span class="cart-indicator" aria-hidden="true"></span>
          </a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1 class="header-title">Your Cart</h1>
      <section id="cart-items" class="container-home">
        <!-- Cart products dynamically injected here -->
      </section>
      <section id="checkout-forms" class="checkout-forms">
        <form id="customer-form" class="checkout-form">
          <h2>Customer Information</h2>
          <label>
            Email
            <input type="email" required />
          </label>
          <label>
            Address
            <input type="text" required />
          </label>
          <label>
            City
            <input type="text" required />
          </label>
          <label>
            Postal Code
            <input type="text" required />
          </label>
        </form>
        <form id="payment-form" class="checkout-form">
          <h2>Payment Details</h2>
          <label>
            Card Number
            <input type="text" placeholder="1234 5678 9012 3456" required />
          </label>
          <label class="row">
            <span>
              Expire
              <input type="text" placeholder="MM/YY" required />
            </span>
            <span>
              CVC
              <input type="text" placeholder="123" required />
            </span>
          </label>
          <!--
    <button type="submit" class="button-confirm">
      Complete Purchase
    </button> -->
        </form>
      </section>
      <div id="cart-summary" class="container-home">
        <p>Total: <span id="cart-total">0.00</span> NOK</p>
        <button id="checkout-btn" class="button-add">Confirm order</button>
      </div>
    </main>

    <footer class="footer">
      <div class="website__rights">
        <p>Terms & conditions</p>
        <p class="website__rights--text">&copy; 2025 GAMEHUB</p>
      </div>
    </footer>
  </body>
</html>
